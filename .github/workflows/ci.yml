name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  docs:
    name: Documentation gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate documentation map and links
        run: python3 packaging/scripts/check-docs.py
  packaging:
    name: Packaging metadata gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate packaging metadata
        run: sudo -n env "PATH=$PATH" packaging/scripts/validate-packaging.sh
  rust:
    name: Rust quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect Rust workspace
        id: rust
        run: |
          if [ -f Cargo.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - name: Install Rust
        if: steps.rust.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        if: steps.rust.outputs.present == 'true'
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Format check
        if: steps.rust.outputs.present == 'true'
        run: cargo fmt --all -- --check
      - name: Clippy
        if: steps.rust.outputs.present == 'true'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        if: steps.rust.outputs.present == 'true'
        run: |
          set -euo pipefail
          umask 077
          test_state_dir="$(mktemp -d "${RUNNER_TEMP}/skynet-edr-rust-tests.XXXXXX")"
          trap 'rm -rf -- "$test_state_dir"' EXIT
          chmod 700 -- "$test_state_dir"
          export SKYNET_EDR_STATE_DIR="$test_state_dir"
          cargo test --workspace --all-features
      - name: No Rust workspace yet
        if: steps.rust.outputs.present != 'true'
        run: echo "No Cargo.toml yet; Rust CI will activate when the workspace is added."
  python:
    name: Hermes integration quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test Hermes Web Dashboard behavior
        run: node --test integrations/hermes/skynet-edr/dashboard/plugin.test.mjs
      - name: Test Hermes Desktop Risk Explorer behavior
        run: node --test integrations/hermes/skynet-edr/desktop/plugin.test.mjs
      - name: Test dependency-free Hermes plugin
        run: python3 -m unittest discover -s integrations/hermes/tests -p 'test_*.py'
  s2-validation:
    name: S2 M4a validation report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy
      - name: Prime locked Rust dependencies
        run: cargo fetch --locked
      - name: Run offline S2 validation
        run: |
          root_parent="$(sudo -n mktemp -d /var/lib/skynet-edr-s2.XXXXXX)"
          trap 'sudo -n rm -rf -- "$root_parent"' EXIT
          sudo -n env "PATH=$PATH" "CARGO_HOME=$CARGO_HOME" \
            packaging/scripts/validate-s2.sh --output "$root_parent/report"
          sudo -n mv -- "$root_parent/report" "${RUNNER_TEMP}/skynet-edr-s2-report"
          sudo -n chown -R "$(id -u):$(id -g)" "${RUNNER_TEMP}/skynet-edr-s2-report"
          sudo -n rmdir -- "$root_parent"
          trap - EXIT
      - name: Upload S2 validation report
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skynet-edr-s2-validation
          path: ${{ runner.temp }}/skynet-edr-s2-report
          retention-days: 14
