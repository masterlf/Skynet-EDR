name: CodeQL
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '33 3 * * 2'
permissions:
  contents: read
jobs:
  analyze:
    name: CodeQL analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [rust, python]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Detect language files
        id: detect
        shell: bash
        run: |
          case "${{ matrix.language }}" in
            rust)
              if find . -name '*.rs' | grep -q .; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
              ;;
            python)
              if find . -name '*.py' | grep -q .; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
              ;;
          esac
      - name: Initialize CodeQL
        if: steps.detect.outputs.present == 'true'
        uses: github/codeql-action/init@04daf7543b8a940aebfeb1d2c4734d1c048e05d6 # v4.37.2
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        if: steps.detect.outputs.present == 'true'
        uses: github/codeql-action/autobuild@04daf7543b8a940aebfeb1d2c4734d1c048e05d6 # v4.37.2
      - name: Perform CodeQL Analysis
        if: steps.detect.outputs.present == 'true'
        uses: github/codeql-action/analyze@04daf7543b8a940aebfeb1d2c4734d1c048e05d6 # v4.37.2
      - name: No files for language yet
        if: steps.detect.outputs.present != 'true'
        run: echo "No ${{ matrix.language }} files yet; CodeQL will activate when code is added."
