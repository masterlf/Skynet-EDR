name: Packaging release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional package version override; defaults to Cargo package version"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: Build and inspect Linux packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NFPM_VERSION: v2.46.3
      NFPM_ARCH: amd64
      NFPM_RPM_ARCH: x86_64
      NFPM_ARCHLINUX_ARCH: x86_64
      NFPM_SHA256: 9170d25ea056d7329def38134b2bcad98d02d221f8331610dcd619e84d28c565
      SKYNET_EDR_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install package inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl ca-certificates rpm zstd

      - name: Install nFPM
        run: |
          archive="nfpm_${NFPM_VERSION#v}_Linux_x86_64.tar.gz"
          curl -fsSLO "https://github.com/goreleaser/nfpm/releases/download/${NFPM_VERSION}/${archive}"
          printf '%s  %s\n' "${NFPM_SHA256}" "${archive}" | sha256sum -c -
          tar -xzf "${archive}" nfpm
          sudo install -m 0755 nfpm /usr/local/bin/nfpm
          nfpm --version

      - name: Validate packaging metadata
        run: packaging/scripts/validate-packaging.sh

      - name: Validate package version override
        run: |
          if [ -n "${SKYNET_EDR_VERSION}" ]; then
            case "${SKYNET_EDR_VERSION}" in
              *[!0-9A-Za-z.+~-]*|.*|-*|*..*)
                echo "invalid SKYNET_EDR_VERSION: ${SKYNET_EDR_VERSION}" >&2
                exit 1
                ;;
            esac
          fi

      - name: Prepare clean dist directory
        run: rm -rf dist

      - name: Build tarball artifact
        run: packaging/scripts/build-tarball.sh

      - name: Build deb/rpm/Arch artifacts with nFPM
        run: packaging/scripts/build-packages.sh

      - name: Inspect package contents and generate checksums
        run: packaging/scripts/inspect-artifacts.sh dist

      - name: Smoke DEB/tarball in clean containers and validate RPM/Arch
        run: packaging/scripts/smoke-install-artifacts.sh dist

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skynet-edr-linux-amd64-packages
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/checksums.txt
            dist/inspection/*.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release for version tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES_FILE="docs/releases/${GITHUB_REF_NAME}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "missing reviewed release notes: $NOTES_FILE" >&2
            exit 1
          fi
          cp "$NOTES_FILE" dist/release-notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release already exists; refusing to replace published assets: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz \
            dist/*.deb \
            dist/*.rpm \
            dist/*.pkg.tar.zst \
            dist/checksums.txt \
            --title "Skynet-EDR ${GITHUB_REF_NAME} — reliable passive detection" \
            --notes-file dist/release-notes.md \
            --prerelease \
            --verify-tag
