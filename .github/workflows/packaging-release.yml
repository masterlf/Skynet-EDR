name: Packaging release

on:
  workflow_dispatch:
    inputs:
      product_version:
        description: "Canonical product SemVer"
        required: true
        default: "0.7.0-alpha.2"
        type: string
      deb_version:
        description: "Native Debian package version"
        required: true
        default: "0.7.0~alpha.2"
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: Build and inspect Linux packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NFPM_VERSION: v2.46.3
      NFPM_ARCH: amd64
      NFPM_RPM_ARCH: x86_64
      NFPM_ARCHLINUX_ARCH: x86_64
      NFPM_SHA256: 9170d25ea056d7329def38134b2bcad98d02d221f8331610dcd619e84d28c565
      SKYNET_EDR_PRODUCT_VERSION: ${{ inputs.product_version || '0.7.0-alpha.2' }}
      SKYNET_EDR_DEB_VERSION: ${{ inputs.deb_version || '0.7.0~alpha.2' }}
      HERMES_REPOSITORY: https://github.com/NousResearch/hermes-agent.git
      PLAYWRIGHT_BROWSERS_PATH: /tmp/skynet-edr-ms-playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out the pinned official Hermes gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: f5be9236e00ddf2f2a412697f267078fc4ee068e
          path: .ci/hermes-agent
          persist-credentials: false

      - name: Check out the pinned Hermes 0.20 dispatcher contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: 3c27eb6234bf91b8ceee9e9071591b31e9b148cb
          path: .ci/hermes-agent-dispatch
          persist-credentials: false

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: false

      - name: Prepare frozen Hermes and browser dependencies before artifact build
        run: |
          uv sync --frozen --project "$GITHUB_WORKSPACE/.ci/hermes-agent"
          uv sync --frozen --project "$GITHUB_WORKSPACE/.ci/hermes-agent-dispatch"
          npm ci --ignore-scripts --no-audit --no-fund --prefix packaging/browser-gate
          npm exec --prefix packaging/browser-gate -- playwright install --with-deps chromium
          test -x "$GITHUB_WORKSPACE/.ci/hermes-agent/.venv/bin/hermes"
          test -x "$GITHUB_WORKSPACE/.ci/hermes-agent-dispatch/.venv/bin/hermes"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2

      - name: Prime locked Rust dependencies
        run: cargo fetch --locked

      - name: Release threat validation gate
        run: python3 packaging/scripts/threat-validation.py --output target/threat-validation/evidence.json

      - name: Install package inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl ca-certificates rpm zstd

      - name: Install nFPM
        run: |
          archive="nfpm_${NFPM_VERSION#v}_Linux_x86_64.tar.gz"
          curl -fsSLO "https://github.com/goreleaser/nfpm/releases/download/${NFPM_VERSION}/${archive}"
          printf '%s  %s\n' "${NFPM_SHA256}" "${archive}" | sha256sum -c -
          tar -xzf "${archive}" nfpm
          sudo install -m 0755 nfpm /usr/local/bin/nfpm
          nfpm --version

      - name: Validate packaging metadata
        run: |
          export SKYNET_EDR_EXPECTED_PRODUCT_VERSION="${SKYNET_EDR_PRODUCT_VERSION}"
          export SKYNET_EDR_EXPECTED_DEB_VERSION="${SKYNET_EDR_DEB_VERSION}"
          if [[ "${GITHUB_REF}" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "${SKYNET_EDR_PRODUCT_VERSION}" ]]; then
            echo "tag/product version mismatch" >&2
            exit 1
          fi
          sudo -n env "HOME=/root" "PATH=$PATH" \
            "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" \
            "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" \
            "SKYNET_EDR_EXPECTED_PRODUCT_VERSION=$SKYNET_EDR_EXPECTED_PRODUCT_VERSION" \
            "SKYNET_EDR_EXPECTED_DEB_VERSION=$SKYNET_EDR_EXPECTED_DEB_VERSION" \
            packaging/scripts/validate-packaging.sh

      - name: Validate exact release identity planes
        run: |
          test "${SKYNET_EDR_PRODUCT_VERSION}" = "0.7.0-alpha.2"
          test "${SKYNET_EDR_DEB_VERSION}" = "0.7.0~alpha.2"

      - name: Prepare clean dist directory
        run: rm -rf dist

      - name: Build tarball artifact
        run: packaging/scripts/build-tarball.sh

      - name: Build deb/rpm/Arch artifacts with nFPM
        run: packaging/scripts/build-packages.sh

      - name: Verify accepted reproducible DEB identity
        run: >-
          printf '%s  %s\n'
          'af5c1d6d97095438138cb50a3beb5ed7cd8f75f775283db7b43d9a027e869a6e'
          'dist/skynet-edr_0.7.0-alpha.2_amd64.deb' | sha256sum -c -

      - name: Inspect package contents and generate checksums
        run: packaging/scripts/inspect-artifacts.sh dist

      - name: Smoke DEB/tarball in clean containers and validate RPM/Arch
        run: packaging/scripts/smoke-install-artifacts.sh dist

      - name: Authoritative disposable DEB/systemd deployment gate
        env:
          SKYNET_EDR_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          SKYNET_EDR_DISPOSABLE_SMOKE: "1"
        run: |
          (cd dist && sha256sum -c checksums.txt)
          deb=$(find dist -maxdepth 1 -type f -name 'skynet-edr_*.deb' -print -quit)
          test -n "$deb"
          sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            SKYNET_EDR_RUNNER_ENVIRONMENT="$SKYNET_EDR_RUNNER_ENVIRONMENT" \
            SKYNET_EDR_DISPOSABLE_SMOKE="$SKYNET_EDR_DISPOSABLE_SMOKE" \
            packaging/scripts/vm-smoke.sh --deb "$deb" --repo "$GITHUB_WORKSPACE"
          (cd dist && sha256sum -c checksums.txt)

      - name: Exact artifact Hermes 0.20.0 plugin activation and browser compatibility gate
        env:
          SKYNET_EDR_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          (cd dist && sha256sum -c checksums.txt)
          deb=$(find dist -maxdepth 1 -type f -name 'skynet-edr_*.deb' -print -quit)
          test -n "$deb"
          packaging/scripts/exact-artifact-browser-gate.sh \
            --deb "$deb" --hermes-repo "$GITHUB_WORKSPACE/.ci/hermes-agent"
          packaging/scripts/hermes-real-dispatch-gate.sh \
            --hermes-repo "$GITHUB_WORKSPACE/.ci/hermes-agent-dispatch" \
            --plugin-source /usr/share/skynet-edr/hermes-plugin/skynet-edr
          (cd dist && sha256sum -c checksums.txt)

      - name: Verify exact gated bytes before upload or publication
        run: (cd dist && sha256sum -c checksums.txt)

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skynet-edr-linux-amd64-packages
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/checksums.txt
            dist/inspection/*.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release for version tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum -c checksums.txt)
          NOTES_FILE="docs/releases/${GITHUB_REF_NAME}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "missing reviewed release notes: $NOTES_FILE" >&2
            exit 1
          fi
          cp "$NOTES_FILE" dist/release-notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release already exists; refusing to replace published assets: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          publication_mode=$(python3 packaging/scripts/release-publication-mode.py "${SKYNET_EDR_PRODUCT_VERSION}")
          release_flags=()
          if [ "$publication_mode" = "prerelease" ]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz \
            dist/*.deb \
            dist/*.rpm \
            dist/*.pkg.tar.zst \
            dist/checksums.txt \
            --title "Skynet-EDR ${GITHUB_REF_NAME} — reliable passive detection" \
            --notes-file dist/release-notes.md \
            "${release_flags[@]}" \
            --verify-tag
