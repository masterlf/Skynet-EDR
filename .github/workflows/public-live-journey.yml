name: Public live detection journey
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-journey:
    name: Published DEB to live Hermes incident
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/skynet-public-journey-browsers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify evidence checker regressions
        run: python3 -m unittest discover -s packaging/tests -p test_public_journey_evidence.py
      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.3'
          enable-cache: false
      - name: Prepare public dependencies and immutable release artifact
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dbus-user-session python3-venv
          # The enrollment adapter requires root-owned, non-writable launcher ancestors.
          # Hosted runners make /opt and /usr/share writable by non-root users.
          sudo chown root:root /opt /usr/share
          sudo chmod 0755 /opt /usr/share
          sudo git clone --depth 1 --branch v2026.8.3 https://github.com/NousResearch/hermes-agent.git /opt/skynet-journey-hermes
          test "$(sudo git -C /opt/skynet-journey-hermes rev-parse HEAD)" = 3c27eb6234bf91b8ceee9e9071591b31e9b148cb
          sudo "$(command -v uv)" sync --frozen --project /opt/skynet-journey-hermes --python /usr/bin/python3
          sudo chmod -R go-w /opt/skynet-journey-hermes
          npm ci --ignore-scripts --no-audit --no-fund --prefix packaging/browser-gate
          npm exec --prefix packaging/browser-gate -- playwright install --with-deps chromium
          curl --fail --location --proto '=https' --tlsv1.2 --output "$RUNNER_TEMP/skynet-edr.deb" \
            https://github.com/masterlf/Skynet-EDR/releases/download/v0.7.0-alpha.2/skynet-edr_0.7.0-alpha.2_amd64.deb
          printf '%s  %s\n' aca54b93ecea85f8b789d5d8600b5ae1554b1513089a6778a5253fc1e11eaee4 "$RUNNER_TEMP/skynet-edr.deb" | sha256sum -c -
      - name: Run public install enrollment dispatch persistence and browser journey
        run: |
          set -o pipefail
          # Temporary exception-only diagnostic; remove before a qualifying run.
          sudo python3 - <<'PY'
          from pathlib import Path
          import sitecustomize
          path = Path(sitecustomize.__file__)
          assert path == Path('/usr/lib/python3.12/sitecustomize.py')
          with path.open('a') as stream:
              stream.write('''
          def _skynet_journey_trace_install():
              import os, sys, json
              source = '/usr/libexec/skynet-edr/hermes-enrollment-adapter.py'
              if not sys.argv or sys.argv[0] != source or os.geteuid() != 0:
                  return
              count = 0
              def observe(frame, event, value):
                  nonlocal count
                  if frame.f_code.co_filename != source:
                      return None
                  frame.f_trace_lines = False
                  if event == 'return' and frame.f_code.co_name in {'_gateway_context_matches', '_process_groups', 'authorization_ok'}:
                      record = {'function': frame.f_code.co_name, 'result': sorted(value) if isinstance(value, set) else value}
                      if frame.f_code.co_name == '_gateway_context_matches' and value is False:
                          record['missing_names'] = sorted(item.split('=', 1)[0] for item in frame.f_locals['expected'] - frame.f_locals['values'])
                      try:
                          fd = os.open('/var/lib/skynet-public-journey/adapter-trace.jsonl',
                                       os.O_WRONLY | os.O_APPEND | os.O_CREAT | os.O_NOFOLLOW, 0o600)
                          os.write(fd, (json.dumps(record) + '\\n').encode())
                          os.close(fd)
                      except OSError:
                          pass
                  if event == 'exception' and count < 100:
                      count += 1
                      error = value[1]
                      category = getattr(error, 'category', None)
                      if not isinstance(category, str) or not category.replace('_', '').isalpha() or len(category) > 50:
                          category = None
                      record = {'function': frame.f_code.co_name, 'line': frame.f_lineno,
                                'exception': type(error).__name__, 'category': category}
                      try:
                          fd = os.open('/var/lib/skynet-public-journey/adapter-trace.jsonl',
                                       os.O_WRONLY | os.O_APPEND | os.O_CREAT | os.O_NOFOLLOW, 0o600)
                          os.write(fd, (json.dumps(record) + '\\n').encode())
                          os.close(fd)
                      except OSError:
                          pass
                  return observe
              sys.settrace(observe)
          _skynet_journey_trace_install()
          ''')
          PY
          sudo env PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" \
            timeout --signal=TERM --kill-after=20s 12m \
            bash packaging/scripts/public-live-journey.sh --disposable-host \
              --deb "$RUNNER_TEMP/skynet-edr.deb" \
              --hermes-repo /opt/skynet-journey-hermes \
              --browser-runtime "$GITHUB_WORKSPACE/packaging/browser-gate" \
            | tee "$RUNNER_TEMP/public-journey.json"
      - name: Retain bounded public verdict
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-live-journey-verdict
          path: ${{ runner.temp }}/public-journey.json
          if-no-files-found: warn
          retention-days: 30
