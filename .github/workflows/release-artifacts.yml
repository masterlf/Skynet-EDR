name: Release artifacts
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      package_ref:
        description: "Git ref/SHA to build. Defaults to the workflow ref."
        required: false
        type: string
permissions:
  contents: read
jobs:
  linux-packages:
    name: Build Linux package artifacts
    runs-on: ubuntu-latest
    env:
      NFPM_VERSION: v2.46.3
      NFPM_SHA256: 9170d25ea056d7329def38134b2bcad98d02d221f8331610dcd619e84d28c565
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.package_ref || github.ref }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install package inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm zstd
      - name: Install nFPM
        run: |
          archive="nfpm_${NFPM_VERSION#v}_Linux_x86_64.tar.gz"
          curl -fsSLO "https://github.com/goreleaser/nfpm/releases/download/${NFPM_VERSION}/${archive}"
          printf '%s  %s\n' "${NFPM_SHA256}" "${archive}" | sha256sum -c -
          tar -xzf "${archive}" nfpm
          sudo install -m 0755 nfpm /usr/local/bin/nfpm
          nfpm --version
      - name: Validate packaging baseline
        run: >-
          sudo -n env "HOME=/root" "PATH=$PATH"
          "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}"
          "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}"
          packaging/scripts/validate-packaging.sh
      - name: Build package artifacts
        run: |
          rm -rf dist
          packaging/scripts/build-tarball.sh
          packaging/scripts/build-packages.sh
      - name: Inspect package contents
        run: packaging/scripts/inspect-artifacts.sh dist
      - name: Smoke DEB/tarball in clean containers and validate RPM/Arch
        run: packaging/scripts/smoke-install-artifacts.sh dist
      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skynet-edr-linux-packages
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/checksums.txt
          if-no-files-found: error
