[package]
name = "skynet-edr-daemon"
description = "Daemon entry point for Skynet-EDR runtime monitoring."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "skynet-edr-daemon"
path = "src/main.rs"

[dependencies]
nix = { version = "=0.27.1", default-features = false, features = ["fs", "socket", "user"] }
skynet-edr-core = { version = "0.4.1", path = "../skynet-edr-core" }
skynet-edr-mcp = { version = "0.4.1", path = "../skynet-edr-mcp" }
serde_json = "1.0"

[dev-dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }

[lints]
workspace = true
