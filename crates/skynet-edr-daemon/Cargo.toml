[package]
name = "skynet-edr-daemon"
description = "Daemon entry point for Skynet-EDR runtime monitoring."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "skynet-edr-daemon"
path = "src/main.rs"

[dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["fs", "socket", "user"] }
skynet-edr-core = { version = "0.5.0", path = "../skynet-edr-core" }
skynet-edr-mcp = { version = "0.5.0", path = "../skynet-edr-mcp" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }

[dev-dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }

[lints]
workspace = true
